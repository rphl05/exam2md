<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>exam2md</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2430; --muted: #667085; --line: #e3e6eb;
    --accent: #2f6fde; --accent-soft: #e8f0fd; --ok: #1f8a4c; --err: #c4352b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --card: #1c2028; --text: #e7e9ee; --muted: #98a1b0; --line: #2c323d;
            --accent: #6b9cf0; --accent-soft: #1f2a3d; --ok: #4cc382; --err: #f07167; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .sub { margin: 0 0 24px; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .drop { border: 2px dashed var(--line); border-radius: 10px; padding: 32px 16px; text-align: center;
          cursor: pointer; transition: border-color .15s, background .15s; }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop strong { display: block; font-size: 16px; margin-bottom: 4px; }
  .drop span { color: var(--muted); font-size: 13px; }
  #lista { list-style: none; padding: 0; margin: 12px 0 0; }
  #lista li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0;
              border-bottom: 1px solid var(--line); font-size: 14px; }
  #lista li button { border: 0; background: none; color: var(--muted); cursor: pointer; }
  .opcoes { display: grid; gap: 12px; margin-top: 16px; }
  .opcoes label { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
  .opcoes small { display: block; color: var(--muted); }
  input[type=text] { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
                     background: var(--bg); color: var(--text); font: inherit; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 8px; padding: 10px 18px;
         font: inherit; font-weight: 600; cursor: pointer; background: var(--accent); color: #fff; text-decoration: none; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.sec { background: var(--accent-soft); color: var(--accent); }
  .acoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .barra { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 8px 0; }
  .barra div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .status { color: var(--muted); font-size: 14px; }
  .ok { color: var(--ok); } .err { color: var(--err); }
  textarea { width: 100%; height: 360px; margin-top: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 8px;
             background: var(--bg); color: var(--text); font: 13px/1.45 ui-monospace, Consolas, monospace; resize: vertical; }
  .oculto { display: none; }
  footer { color: var(--muted); font-size: 13px; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>exam2md</h1>
  <p class="sub">Converte provas em PDF para Markdown com fórmulas em LaTeX e imagens nomeadas por questão. Tudo roda no seu computador.</p>

  <section class="card">
    <div class="drop" id="drop" tabindex="0">
      <strong>Arraste os PDFs aqui</strong>
      <span>ou clique para escolher (pode selecionar vários)</span>
      <input type="file" id="arquivo" accept=".pdf,application/pdf" multiple hidden>
    </div>
    <ul id="lista"></ul>

    <div class="opcoes">
      <label><input type="checkbox" id="imagens" checked>
        <span>Extrair imagens<small>Salva em <code>prova_images/</code> com nome da questão (ex.: <code>prova_q05_1.png</code>, <code>prova_q05_altB_1.png</code>).</small></span></label>
      <label><input type="checkbox" id="formulas">
        <span>Fórmulas em imagem → LaTeX (pix2tex)<small>Para provas em que as fórmulas são figuras. Mais lento; requer <code>pip install pix2tex</code>.</small></span></label>
      <div>
        <label for="paginas" style="display:block;margin-bottom:4px">Páginas (opcional)</label>
        <input type="text" id="paginas" placeholder="Todas — ou ex.: 1-5, 8, 10">
      </div>
    </div>

    <div class="acoes">
      <button class="btn" id="converter" disabled>Converter</button>
    </div>
  </section>

  <section class="card oculto" id="painel">
    <div class="status" id="status">Enviando…</div>
    <div class="barra"><div id="barra"></div></div>
    <div id="resultados"></div>
    <div class="acoes oculto" id="acoes">
      <a class="btn" id="baixar" href="#">Baixar</a>
      <button class="btn sec" id="copiar">Copiar Markdown</button>
    </div>
    <textarea id="previa" class="oculto" readonly></textarea>
  </section>

  <footer>exam2md · pdfplumber + LaTeX · nenhum arquivo sai do seu computador</footer>
</main>

<script>
const $ = (id) => document.getElementById(id);
let arquivos = [];

function atualizarLista() {
  $('lista').innerHTML = '';
  arquivos.forEach((f, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span></span><button title="Remover">✕</button>`;
    li.querySelector('span').textContent = `${f.name} (${(f.size / 1048576).toFixed(1)} MB)`;
    li.querySelector('button').onclick = () => { arquivos.splice(i, 1); atualizarLista(); };
    $('lista').appendChild(li);
  });
  $('converter').disabled = arquivos.length === 0;
  $('converter').textContent = arquivos.length > 1 ? `Converter ${arquivos.length} provas` : 'Converter';
}

function adicionar(lista) {
  for (const f of lista) {
    if (f.name.toLowerCase().endsWith('.pdf') && !arquivos.some(a => a.name === f.name && a.size === f.size)) arquivos.push(f);
  }
  atualizarLista();
}

const drop = $('drop');
drop.onclick = () => $('arquivo').click();
drop.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') $('arquivo').click(); };
$('arquivo').onchange = (e) => { adicionar(e.target.files); e.target.value = ''; };
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => adicionar(e.dataTransfer.files));

function escapar(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

// Lê a resposta mesmo quando não é JSON e transforma qualquer 'detail' em texto legível
async function lerJson(r) {
  const texto = await r.text();
  let j;
  try { j = JSON.parse(texto); } catch { j = { detail: texto || `HTTP ${r.status}` }; }
  if (!r.ok) {
    const d = j.detail;
    const msg = typeof d === 'string' ? d
      : Array.isArray(d) ? d.map(e => e.msg || JSON.stringify(e)).join('; ')
      : d ? JSON.stringify(d) : `Erro HTTP ${r.status}`;
    throw new Error(msg);
  }
  return j;
}

$('converter').onclick = async () => {
  const dados = new FormData();
  arquivos.forEach(f => dados.append('files', f));
  if ($('paginas').value.trim()) dados.append('pages', $('paginas').value.trim());
  dados.append('extrair_imagens', $('imagens').checked);
  dados.append('formulas_imagem', $('formulas').checked);

  $('converter').disabled = true;
  $('painel').classList.remove('oculto');
  ['acoes', 'previa'].forEach(id => $(id).classList.add('oculto'));
  $('resultados').innerHTML = '';
  $('barra').style.width = '0';
  $('status').textContent = 'Enviando…';

  try {
    const j = await lerJson(await fetch('/convert', { method: 'POST', body: dados }));
    acompanhar(j.job_id);
  } catch (e) {
    $('status').innerHTML = `<span class="err">${escapar(e.message)}</span>`;
    $('converter').disabled = false;
  }
};

async function acompanhar(id) {
  try {
    const j = await lerJson(await fetch(`/jobs/${id}`));
    $('barra').style.width = j.progresso + '%';
    if (j.status !== 'concluido') {
      $('status').textContent = j.status === 'na_fila' ? 'Na fila…'
        : `Convertendo ${j.arquivo_atual || ''}… ${j.progresso}%` + ($('formulas').checked ? ' (o modelo de fórmulas leva ~1 min para carregar na 1ª vez)' : '');
      setTimeout(() => acompanhar(id), 700);
      return;
    }
    const ok = j.resultados.filter(x => x.ok);
    $('status').innerHTML = ok.length ? `<span class="ok">Concluído.</span>` : `<span class="err">Nenhum arquivo convertido.</span>`;
    $('resultados').innerHTML = j.resultados.map(x => x.ok
      ? `<div>✅ <strong>${escapar(x.arquivo)}</strong> — ${x.paginas} páginas, ${x.imagens} imagens, ${x.caracteres.toLocaleString('pt-BR')} caracteres</div>`
      : `<div class="err">❌ ${escapar(x.pdf)}: ${escapar(x.erro)}</div>`).join('');
    if (j.download) {
      const zip = ok.length > 1 || ok[0].imagens > 0;
      $('baixar').href = j.download;
      $('baixar').textContent = zip ? 'Baixar .zip (Markdown + imagens)' : `Baixar ${ok[0].arquivo}`;
      $('previa').value = j.previa + (j.previa_truncada ? '\n\n[… prévia cortada — baixe o arquivo completo]' : '');
      ['acoes', 'previa'].forEach(i => $(i).classList.remove('oculto'));
    }
  } catch (e) {
    $('status').innerHTML = `<span class="err">${escapar(e.message)}</span>`;
  }
  $('converter').disabled = arquivos.length === 0;
}

$('copiar').onclick = async () => {
  try { await navigator.clipboard.writeText($('previa').value); $('copiar').textContent = 'Copiado!'; }
  catch { $('previa').select(); document.execCommand('copy'); $('copiar').textContent = 'Copiado!'; }
  setTimeout(() => $('copiar').textContent = 'Copiar Markdown', 1500);
};
</script>
</body>
</html>
